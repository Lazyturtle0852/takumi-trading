<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>カード印刷シート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Fraunces:opsz,wght,SOFT@144,900,100&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="card.css">
<style>
  body{margin:0;background:#888}
  .help{font:14px/1.7 system-ui,sans-serif;color:#fff;text-align:center;padding:12px}
  .help a{color:#fff;font-weight:700}
  .help a.on{background:#fff;color:#333;border-radius:4px;padding:1px 6px;text-decoration:none}
</style>
</head>
<body>
<div class="help no-print">
  <div id="modes"></div>
  <div id="howto"></div>
  <code>?data=data/cards.json</code> を付けると本番データを読む（指定がなければダミー）。
</div>
<div id="sheets"></div>
<script src="card.js"></script>
<script src="card-back.js"></script>
<script src="print-sheets.js"></script>
<script src="sample-cards.js"></script>
<script>
const params = new URLSearchParams(location.search);
const mode = params.get("mode") === "duplex" ? "duplex" : "pair";
document.getElementById("modes").innerHTML = sheetModeLinks(mode);
document.getElementById("howto").textContent = SHEET_MODES[mode].howto;

async function load() {
  const src = params.get("data");
  if (!src) return SAMPLE_CARDS;
  const res = await fetch(src);
  const json = await res.json();
  return Array.isArray(json) ? json : json.cards;  // プロンプトの出力は { cards: [...] }
}

load().then(cards => {
  document.getElementById("sheets").innerHTML = buildSheets(cards, mode, c => renderCard(c, cards.length), renderBack);
});
</script>
</body>
</html>
